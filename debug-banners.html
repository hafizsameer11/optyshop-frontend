<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .banner { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Banner API Debug</h1>
    <div id="output"></div>
    
    <script>
        async function testBannerAPI() {
            const output = document.getElementById('output');
            
            try {
                // Test the banners API
                const response = await fetch('https://optyshop-frontend.hmstech.org/api/banners');
                const data = await response.json();
                
                output.innerHTML = `
                    <div class="success">API Response Success!</div>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                
                // Test individual banner images
                if (data.success && data.data && data.data.banners) {
                    data.data.banners.forEach((banner, index) => {
                        const div = document.createElement('div');
                        div.className = 'banner';
                        div.innerHTML = `
                            <h3>Banner ${index + 1}: ${banner.title}</h3>
                            <p><strong>Image URL:</strong> ${banner.image_url}</p>
                            <p><strong>Link URL:</strong> ${banner.link_url}</p>
                            <p><strong>Page Type:</strong> ${banner.page_type}</p>
                            <p><strong>Category ID:</strong> ${banner.category_id}</p>
                            <p><strong>Position:</strong> ${banner.position}</p>
                            <p><strong>Is Active:</strong> ${banner.is_active}</p>
                            <img src="${banner.image_url}" alt="${banner.title}" style="max-width: 300px; height: auto;" onerror="this.style.display='none'">
                        `;
                        output.appendChild(div);
                    });
                }
            } catch (error) {
                output.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        testBannerAPI();
    </script>
</body>
</html>
